<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" href="/images/logo.png" as="image" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B4D35" />
    <meta name="description" content="KOA Engineering provides world-class structural and civil engineering solutions, driving innovation and precision globally." />
    <meta name="keywords" content="Civil Engineering, Structural Design, KOA Engineering, Construction, Infrastructure, Renewable Energy" />
    <meta name="author" content="KOA Engineering" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KOA Engineering" />
    <meta property="og:title" content="KOA Engineering - Structural & Civil Excellence" />
    <meta property="og:description" content="Precision and innovation in structural and civil engineering." />
    <meta property="og:image" content="/images/logo.png" />
    <title>KOA Engineering - Structural & Civil Excellence</title>
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #0D1F17;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
      }
      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #preloader img {
        width: 300px;
        max-width: 80vw;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50%       { opacity: 1;   transform: scale(1.05); }
      }
      #preloader-tagline {
        margin-top: 4px;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 1.125rem;
        letter-spacing: 0.08em;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        border-right: 2px solid #ffffff;
        width: 0;
        animation:
          typewriter 2s steps(38, end) 0.8s forwards,
          blink 0.7s step-end 0.8s infinite;
      }
      @keyframes typewriter {
        from { width: 0; }
        to   { width: 33ch; }
      }
      @keyframes blink {
        0%, 100% { border-color: #ffffff; }
        50%       { border-color: transparent; }
      }
      #root {
        visibility: hidden;
      }
      #root.ready {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <img src="/images/logo.png" alt="KOA Engineering" />
      <span id="preloader-tagline">Pushing Boundaries. Building Futures.</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
